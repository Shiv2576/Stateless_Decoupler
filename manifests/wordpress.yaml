apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        # nginx + PHP-FPM in one container, both serving WordPress straight from
        # the image layer. Previously these were separate containers sharing an
        # emptyDir that an initContainer had to populate with ~12k files on every
        # pod start — a fixed tax on every scale-out, paid to hand nginx files it
        # could simply have had already.
        - name: wordpress
          image: wordpress-custom:6.6-php8.2-fpm-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - containerPort: 9000
          env:
            - name: WORDPRESS_DB_HOST
              value: "mysql:3306"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "wpuser"
            - name: WORDPRESS_DB_PASSWORD
              value: "wppassword"
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_REDIS_HOST', 'redis');
                define('WP_REDIS_PORT', 6379);
          volumeMounts:
            - name: wp-config
              mountPath: /var/www/html/wp-config.php
              subPath: wp-config.php
            # Alpine's nginx package includes /etc/nginx/http.d/*.conf, not the
            # conf.d/ path used by the nginx:alpine image.
            - name: nginx-config
              mountPath: /etc/nginx/http.d/default.conf
              subPath: nginx.conf
          # Sum of what the two separate containers previously reserved, so the
          # pod's total footprint is unchanged by the merge. fpm-autotune.sh
          # derives pm.max_children from this limit at startup.
          resources:
            limits:
              memory: 768Mi
              cpu: "750m"
            requests:
              memory: 384Mi
              cpu: "350m"

          # Gates readiness/liveness until the pod genuinely serves traffic,
          # instead of the previous fixed 20s initialDelaySeconds — which spent
          # ~20s of every scale-out waiting on a pod that was already up.
          # Checking once a second means readiness is detected when it happens
          # rather than up to a period later.
          startupProbe:
            httpGet:
              path: /fpm-status
              port: 80
            periodSeconds: 1
            failureThreshold: 60
          # /fpm-status traverses nginx -> FastCGI -> PHP-FPM, so it proves both
          # processes are up and talking, which an open TCP port does not.
          # Deliberately not a WordPress page: tying readiness to MySQL would
          # make a brief database blip pull every pod out of service at once.
          readinessProbe:
            httpGet:
              path: /fpm-status
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /fpm-status
              port: 80
            periodSeconds: 10
            failureThreshold: 3

        # Scrapes PHP-FPM's status page over FastCGI (not through nginx) and
        # re-publishes it as Prometheus metrics. This is what makes the HPA able
        # to scale on worker saturation — the signal that actually reflects
        # user-facing capacity — instead of only CPU, which stays low when
        # workers are blocked on I/O rather than computing.
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:2.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PHP_FPM_SCRAPE_URI
              value: "tcp://127.0.0.1:9000/status"
            - name: PHP_FPM_WEB_LISTEN_ADDRESS
              value: ":9253"
          ports:
            - name: metrics
              containerPort: 9253
          resources:
            limits:
              memory: 64Mi
              cpu: "100m"
            requests:
              memory: 32Mi
              cpu: "10m"

      volumes:
        - name: wp-config
          configMap:
            name: wordpress-config
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
  labels:
    app: wordpress
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
    # Scraped by the ServiceMonitor in manifests/monitoring/php-fpm-metrics.yaml.
    # Named so the ServiceMonitor can reference it by name rather than number.
    - name: metrics
      port: 9253
      targetPort: 9253
  selector:
    app: wordpress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: wordpress
spec:
  rules:
    - http:
        paths:
          # More specific than "/", so Traefik matches this first and proxies
          # media reads straight to MinIO's S3 API — keeps MinIO off the host
          # network entirely while giving the browser a stable, reachable URL.
          - path: /wordpress
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wordpress-hpa
  namespace: wordpress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wordpress
  minReplicas: 2
  maxReplicas: 5
  # This is the fallback autoscaler for a cluster with no Prometheus. It has no
  # app-level metric available, so CPU has to stay — but the target is 90, not
  # the more usual 70. Starting a pod costs more CPU than a pod requests (350m),
  # so a 70% target is tripped by pods merely booting, which makes the HPA scale
  # up in response to its own scale-up. manifests/monitoring/php-fpm-metrics.yaml
  # replaces this with PHP-FPM worker saturation, which has no such feedback loop.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
