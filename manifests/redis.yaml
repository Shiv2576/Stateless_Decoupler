apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wordpress
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - "allkeys-lru"
            - --save
            - "900"
            - "1"
            - --save
            - "300"
            - "10"
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: 512Mi
              cpu: "500m"
            requests:
              memory: 256Mi
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wordpress
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
