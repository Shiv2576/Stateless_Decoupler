# Prometheus + Grafana Configuration
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 500m

grafana:
  enabled: true
  adminPassword: admin123
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
    port: 80
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-operated:9090
        access: proxy
        isDefault: false
  dashboards:
    default:
      k6-load-testing:
        gnetId: 19665
        revision: 1
        datasource: Prometheus

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
